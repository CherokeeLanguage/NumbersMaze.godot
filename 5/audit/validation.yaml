spec:
  - round: 1
    artifact_state: as filed (remote-first, post writer self-check)
    verdict: FAIL
    findings:
      - family: fabricated-claims
        classification: finding
        text: '"Each sibling is libGDX/Java" is false for Animals — Animals is a Godot 3 project (project.godot config_version=4) whose legacy libGDX build is reference material per its own #11 spec and whose published artifacts are the legacy libGDX jar+APK staged in dist/; the operative artifact-level claims were accurate, the flat repo characterization was not'
        remediation: Sibling comparison restated precisely — Syllabary/BoundPronouns libGDX, Animals Godot with legacy-jar deploy sources; Problem and Approach reworded to the artifact-level distinction (single desktop jar vs per-OS Godot binaries) that actually drives the design
      - family: gap-analysis
        classification: finding
        text: R-8 requires both itch.conf and .tools/butler/ gitignore entries; SC-3 asserted only itch.conf — a deliverable gitignoring only itch.conf passes every SC while violating R-8's second entry
        remediation: SC-3 extended to assert both entries gitignored, instrument amended (both entries present)
      - family: fabricated-claims
        classification: finding
        text: '"README.md is a 3-line stub" — the file is 2 lines (verified working tree and main)'
        remediation: Count corrected to 2 lines
      - family: fabricated-claims
        classification: finding
        text: '"No 630×500 itch-cover-ratio asset exists" — assets/icons/itch-io-feature-graphic-630x500.png (+ .svg) exists, verified an actual 630×500 PNG (created 2026-11-10 23:54, before the spec final write); the writer''s claim came from a head-truncated directory listing'
        remediation: Observed-facts bullet, R-5 parenthetical, and the out-of-scope cover bullet restated to the verified presence (matching cover asset exists; its upload stays a developer-side runbook step)
    remediation_note: all four findings fixed in .issues/5/spec.md and mirrored into the remote body in the same action; round-2 validation dispatched on the revised artifact
  - round: 2
    artifact_state: post round-1 remediation
    verdict: FAIL
    findings:
      - family: gap-analysis
        classification: finding
        text: R-2 names five fault conditions (butler absent; conf missing; conf REPLACE_ME; conf lacking a required key; artifact path absent) but SC-2's instrument ran only three — the lacking-required-key branch received no instrument run, so that requirement element was demonstrable only by assertion
        remediation: SC-2 extended to enumerate all five fault conditions with five executed runs, one per condition
      - family: fabricated-claims
        classification: finding
        text: '"that repo is outside the developer-named comparison set and not locally present" — a local checkout of the same origin exists at ../CherokeeLessons.com-broken (stale Forestry-era HEAD, no .issues store); the negation was checkable at write time and, as worded, contradicted by disk'
        remediation: Ground restated to the verified facts — the developer-named comparison set is the sufficient scoping ground and the CherokeeLessons.com issue store is locally absent (stale broken checkout noted); the route decision itself survives
    remediation_note: both findings fixed in .issues/5/spec.md (SC-2 mirrored into the remote body in the same action); round-3 validation dispatched on the revised artifact
  - round: 3
    artifact_state: post round-2 remediation
    verdict: PASS
    findings: []
    note: zero-finding verdict — all eight defect classes, all analysis families, and the proactive repo-boundary containment check applied; every factual claim verified against the repo, the three siblings, the research record, and the remote body; live itch namespace and broth URL re-checked
  - round: 4
    artifact_state: post developer directive revision (2026-11-11: itch.io is the only publishing platform going forwards)
    verdict: FAIL
    findings:
      - family: fabricated-claims
        classification: finding
        text: spec attributed the name "Android (aab)" to the machine-local preset — the developer had renamed it to "Android (apk)" during the editor session (file rewritten 09:33, spec written 09:39); only the .aab export-path suffix remains mismatched; the aab name lives in the tracked TV preset (true gradle-AAB config)
        remediation: observed-facts bullet restated to the verified current state (dated); R-5 requirement made state-independent (APK-format prebuilt path, artifact at tmp/NumbersMaze.apk) with the current-state snapshot kept in provenance only
      - family: research-adequacy
        classification: finding
        text: AGENTS.md/#4 state claims stale — AGENTS.md is committed (9e936e3, 2026-11-11, branch ahead of main, #4 in implementation), spec still said untracked/no-commits/spec-phase
        remediation: provenance bullet and R-7 coordination sentence restated to the verified branch state (9e936e3, ahead of main, #4 in implementation); the plan-stage sequencing decision now feeds on true state
      - family: fabricated-claims
        classification: finding
        text: gradle toolchain version list (JDK 17 / android-34 / build-tools 34.0.0 / NDK r23c) asserted without source and contradicted by the repo's own gradle template (android/build/config.gradle — AGP 4.1.2, compileSdk 29, buildTools 30.0.1, NDK 21.4, gradle 6.5); the values were the 3.6 editor-template toolchain from the diagnosis chat, never recorded in the research record
        remediation: version list dropped from the spec (requirement kept as "no gradle build and none of its JDK/Android-SDK prerequisites"); the toolchain facts for BOTH toolchains recorded in the research record with sources (repo config.gradle, 3.6 template android_source.zip, Godot 3.6 docs URL, fetched 2026-11-11)
    remediation_note: all three findings fixed in .issues/5/spec.md and mirrored into the remote body; research card extended and synced; round-5 validation dispatched on the revised artifact
  - round: 5
    artifact_state: post round-4 remediation
    verdict: PASS
    findings: []
    note: zero-finding verdict — all defect classes and analysis families applied; every current-state and negation claim verified against the repo, siblings, research record, and remote body (preset state, AGENTS.md/branch state, toolchain traceability, live itch namespace); repo-boundary containment both prongs pass
